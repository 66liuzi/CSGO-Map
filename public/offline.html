<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

        place-items: center;
        background: #0b0e13;
        color: #e8eef5;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;

      p {

      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #f39c12;
        color: #14100a;

        text-decoration: none;

  <body>
    <div class="box">
      <h1>当前处于离线状态</h1>
      <p>
        这个页面本身也已经被缓存过。打开应用即可继续搜索已缓存的道具点位；<br />
