name: Deploy to GitHub Pages

# 推送到主分支后自动构建并发布到 GitHub Pages
# 用的是 GitHub 官方推荐方式（configure-pages / upload-pages-artifact / deploy-pages），
# 不需要在仓库里保存任何访问令牌。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 搜索测试与数据自检
        run: npm test

      - name: 构建静态站点
        run: npm run build

      - name: 配置 Pages（首次会自动启用 Pages 站点）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
